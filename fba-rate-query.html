<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FBA 运价查询台 · 皓鹏国际 2026-08-31</title>
<style>
  :root{
    --bg:#f6f5f1;
    --bg2:#fff;
    --panel:#ffffff;
    --panel2:#f3f1ea;
    --line:#e7e3d9;
    --line2:#d6d1c4;
    --ink:#262b33;
    --ink2:#5d6675;
    --ink3:#98a0ac;
    --acc:#e07b1f;
    --acc2:#b25e0a;
    --ok:#16a34a;
    --bad:#dc2626;
    --mono:"SF Mono","JetBrains Mono","Fira Code",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.55;
    min-height:100vh;
    background-image:
      linear-gradient(rgba(224,123,31,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(224,123,31,.045) 1px, transparent 1px);
    background-size:44px 44px;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(1100px 460px at 82% -10%, rgba(224,123,31,.06), transparent 60%),
               radial-gradient(900px 420px at -10% 110%, rgba(22,163,74,.035), transparent 60%);
  }
  .wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:0 20px 80px}

  /* ── Header ─────────────────────────── */
  header{padding:44px 0 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;gap:10px}
  .brand .kicker{
    font-family:var(--mono);font-size:11px;letter-spacing:.35em;color:var(--acc);
    display:flex;align-items:center;gap:10px;
  }
  .brand .kicker::before{content:"";width:34px;height:1px;background:var(--acc)}
  .brand h1{
    font-size:clamp(30px,4.6vw,46px);font-weight:800;letter-spacing:-.01em;line-height:1.05;
    font-family:var(--sans);color:var(--ink);
  }
  .brand h1 em{font-style:normal;color:var(--acc)}
  .brand .sub{color:var(--ink2);font-size:13px;font-family:var(--mono);letter-spacing:.05em}
  .stats{display:flex;gap:12px;flex-wrap:wrap}
  .stat{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:12px 18px;min-width:104px;text-align:center;
    border-top:2px solid var(--acc);
    box-shadow:0 1px 3px rgba(30,41,59,.04);
  }
  .stat .n{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--acc2)}
  .stat .l{font-size:11px;color:var(--ink3);margin-top:2px;letter-spacing:.12em}

  /* ── Filter bar ─────────────────────── */
  .filterbar{
    position:sticky;top:12px;z-index:20;
    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;margin-bottom:18px;
    box-shadow:0 8px 26px rgba(30,41,59,.08);
  }
  .frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .fitem label{display:block;font-size:10px;letter-spacing:.14em;color:var(--ink3);margin-bottom:5px;text-transform:uppercase}
  select,input[type=search]{
    width:100%;background:var(--bg2);color:var(--ink);
    border:1px solid var(--line2);border-radius:8px;
    padding:8px 10px;font-size:13px;font-family:var(--sans);outline:none;
    transition:border-color .15s, box-shadow .15s;
    appearance:none;-webkit-appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
    background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
    background-size:5px 5px;background-repeat:no-repeat;
  }
  select:hover,input[type=search]:hover{border-color:var(--acc)}
  select:focus,input[type=search]:focus{border-color:var(--acc);box-shadow:0 0 0 2px rgba(224,123,31,.12)}
  .fitem.search{grid-column:1/-1}
  .fmeta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .fmeta .count{font-family:var(--mono);font-size:13px;color:var(--ink2)}
  .fmeta .count b{color:var(--acc2);font-size:15px}
  .reset{
    background:none;border:1px solid var(--line2);color:var(--ink2);border-radius:7px;
    padding:5px 14px;font-size:12px;cursor:pointer;transition:all .15s;font-family:var(--mono)
  }
  .reset:hover{border-color:var(--acc);color:var(--acc)}
  .f-toggle{display:none}

  /* ── List ───────────────────────────── */
  .result-wrap{display:flex;flex-direction:column;gap:14px}
  .card{
    background:var(--panel);
    border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;position:relative;overflow:hidden;
    box-shadow:0 1px 4px rgba(30,41,59,.05);
    transition:border-color .18s, transform .18s, box-shadow .18s;
    animation:rise .4s ease both;
  }
  .card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 10px 26px rgba(30,41,59,.09)}
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--acc);opacity:.75;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .card .name{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:.01em}
  .card .line-tag{
    font-family:var(--mono);font-size:10.5px;color:var(--acc2);
    border:1px solid rgba(224,123,31,.35);background:rgba(224,123,31,.07);
    padding:2px 9px;border-radius:20px;letter-spacing:.06em;white-space:nowrap;
  }
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .tag{
    font-size:11.5px;padding:3px 10px;border-radius:6px;
    background:var(--panel2);border:1px solid var(--line);color:var(--ink2);
  }
  .tag.tax-y{border-color:rgba(22,163,74,.35);color:var(--ok);background:rgba(22,163,74,.06)}
  .tag.tax-n{border-color:rgba(220,38,38,.3);color:var(--bad);background:rgba(220,38,38,.05)}
  .tag.unit{border-color:rgba(224,123,31,.3);color:var(--acc2);font-family:var(--mono)}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 24px;margin-top:10px}
  .meta .mi{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--ink2)}
  .meta .mi .k{color:var(--ink3);font-size:11px;letter-spacing:.08em;flex-shrink:0;width:56px}
  .meta .mi .v{color:var(--ink);white-space:pre-line}
  .price{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
  .price .pl{font-size:11px;letter-spacing:.14em;color:var(--ink3);margin-bottom:8px;font-family:var(--mono)}
  .ptiers{display:flex;flex-wrap:wrap;gap:8px}
  .ptier{
    flex:1 1 120px;max-width:180px;
    background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    padding:7px 12px;display:flex;flex-direction:column;gap:2px;
  }
  .ptier .t{font-size:11px;color:var(--ink3);font-family:var(--mono)}
  .ptier .p{font-size:15px;font-weight:700;color:var(--acc2);font-family:var(--mono)}
  .ptier .p small{font-size:10px;color:var(--ink3);font-weight:400;margin-left:2px}
  .empty{
    text-align:center;padding:60px 20px;color:var(--ink3);
    border:1px dashed var(--line2);border-radius:14px;font-family:var(--mono);font-size:13px;
    background:var(--panel);
  }

  /* ── View switch ─────────────────────── */
  .vswitch{display:flex;gap:6px;align-items:center}
  .vbtn{
    background:none;border:1px solid var(--line2);color:var(--ink2);border-radius:7px;
    padding:5px 14px;font-size:12px;cursor:pointer;transition:all .15s;font-family:var(--mono)
  }
  .vbtn.active{background:var(--acc);border-color:var(--acc);color:#fff}
  .vbtn:hover:not(.active){border-color:var(--acc);color:var(--acc)}

  /* ── Table view ──────────────────────── */
  .tgroup{margin-bottom:20px;animation:rise .35s ease both}
  .tg-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
  .tg-title{font-size:14px;font-weight:700;color:var(--ink)}
  .tg-title .ln{color:var(--acc2);font-weight:800}
  .tg-meta{font-family:var(--mono);font-size:11px;color:var(--ink3)}
  .tbl-scroll{border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:0 1px 4px rgba(30,41,59,.05)}
  table.tbl{table-layout:fixed;border-collapse:collapse;width:100%;min-width:980px;font-size:12.5px}
  table.tbl thead th{
    position:sticky;top:calc(12px + var(--fb-h, 0px));z-index:5;
    background:var(--panel2);color:var(--ink2);font-weight:600;
    text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);
    white-space:nowrap;font-size:11px;letter-spacing:.02em;
  }
  table.tbl thead th.num{text-align:right}
  table.tbl tbody td{padding:7px 10px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:middle}
  table.tbl tbody td .cl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45;word-break:break-all}
  table.tbl tbody td.c-eta .cl{white-space:pre-line}
  table.tbl tbody tr:nth-child(even){background:rgba(30,41,59,.015)}
  table.tbl tbody tr:hover{background:rgba(224,123,31,.05)}
  table.tbl td.num{text-align:right;font-family:var(--mono);font-weight:600;color:var(--acc2);white-space:nowrap}
  table.tbl td.dash{text-align:right;color:var(--ink3);font-family:var(--mono)}
  table.tbl td.c-name{font-weight:600}
  table.tbl td.c-src{color:var(--ink2);font-family:var(--mono);font-size:11px}
  table.tbl td.c-mode{white-space:nowrap}
  /* 两行截断（渠道/目的地/时效），悬浮显示完整 */
  .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;word-break:break-all;line-height:1.35}
  .tx{font-weight:700}
  .tx-y{color:var(--ok)}
  .tx-n{color:var(--bad)}

  footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    color:var(--ink3);font-size:11.5px;font-family:var(--mono)}
  footer b{color:var(--ink2);font-weight:600}

  @media (max-width:640px){
    header{padding-top:28px}
    .frow{grid-template-columns:1fr 1fr}
    .card .top{flex-direction:column}
    /* 手机端筛选折叠：点按钮展开/收起 */
    .f-toggle{
      display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
      background:var(--panel2);border:1px solid var(--line2);color:var(--ink2);
      border-radius:9px;padding:9px;font-size:13px;cursor:pointer;margin-bottom:10px;
      font-family:var(--mono);transition:all .15s;
    }
    .f-toggle:hover{border-color:var(--acc);color:var(--acc)}
    .filterbar.collapsed .frow{display:none}
    .filterbar.collapsed .f-toggle{margin-bottom:0}
    /* 表格手机端：横向滚动 + 吸顶关闭（小屏幕优先保证能看全字段） */
    .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .tbl-scroll::before{
      content:"← 左右滑动查看全部档位 →";
      display:block;text-align:center;padding:7px;
      font-size:11px;color:var(--ink3);font-family:var(--mono);
      border-bottom:1px dashed var(--line);background:rgba(224,123,31,.04);
    }
    table.tbl thead th{position:static;padding:10px 12px}
    table.tbl thead th.num{padding:10px 8px}
    table.tbl tbody td{padding:11px 12px}
    table.tbl td.num{padding:11px 8px}
    .stat{padding:10px 12px;min-width:0;flex:1}
    .stats{display:flex}
  }
</style>
</head>

        <button class="reset" id="btn-reset">重置筛选</button>

    </div>
  </section>

  <section class="result-wrap" id="list"></section>

  <footer>

    <div>价格单位为源表原始值 · <b>仅用于市场验证</b></div>

</div>

const DATA = window.__FBA_DATA__;
const $ = s => document.querySelector(s);
const state = {file:'', src:'', country:'', head:'', tail:'', goods:'', tax:'', q:'', view:'table'};

/* 解析运输方式 头程/尾程 */
function splitMode(m){
  if(!m) return ['',''];
  const [a,b] = String(m).split('/');
  return [a||'', (b||'').replace(/派$/,'')+'派'||''];
}

/* 初始化选项 */
function init(){
  const uni = (arr)=>[...new Set(arr.filter(v=>v!==null&&v!==undefined&&v!==''))].sort((a,b)=>a.localeCompare(b,'zh'));
  const files = uni(DATA.map(r=>r.文件));
  const srcsAll = uni(DATA.map(r=>r.来源表名));
  const countries = uni(DATA.map(r=>r.国家));
  const heads = uni(DATA.map(r=>splitMode(r.运输方式)[0]));
  const tails = uni(DATA.map(r=>splitMode(r.运输方式)[1]));
  const goods = uni(DATA.map(r=>r.货物类型));
  const fill=(id,arr)=>{const s=$(id);arr.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o)})};
  fill('#f-file',files); updateSrcs(); fill('#f-country',countries); fill('#f-head',heads); fill('#f-tail',tails); fill('#f-goods',goods);

  /* 统计 */
  const chSet = new Set(DATA.map(r=>r.渠道名称));
  $('#st-rec').textContent = DATA.length.toLocaleString();
  $('#st-src').textContent = srcsAll.length;
  $('#st-country').textContent = countries.length;
  $('#st-ch').textContent = chSet.size;
  $('#total').textContent = DATA.length;
}

/* 价格显示：数据原样，展示友好（去冗余小数） */
function fmtPrice(v){
  if(v===null||v===undefined||v==='') return '—';
  const n = Number(v);
  if(Number.isNaN(n)) return v;
  if(Number.isInteger(n)) return n.toLocaleString();
  const s = n.toFixed(2).replace(/\.?0+$/,'');
  return Number(s).toLocaleString();
}
function fmtFull(v){ // 精确值（title 提示用）
  if(v===null||v===undefined) return '—';
  return String(v);
}

function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function updateSrcs(){
  /* 来源表联动：按当前选择的文件重建选项（未选文件则列全部） */
  const sel = $('#f-src');
  const prev = sel.value;
  sel.innerHTML = '<option value="">全部来源</option>';
  let arr = DATA.filter(r=>!state.file || r.文件===state.file).map(r=>r.来源表名);
  arr = [...new Set(arr)].sort((a,b)=>a.localeCompare(b,'zh'));
  arr.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o)});
  if([...sel.options].some(o=>o.value===prev)){ sel.value = prev; }
  else { state.src=''; sel.value=''; }
}

function filter(){
  return DATA.filter(r=>{
    if(state.file && r.文件!==state.file) return false;
    if(state.src && (r.来源表名||'')!==state.src) return false;
    if(state.country && r.国家!==state.country) return false;
    const [h,t] = splitMode(r.运输方式);
    if(state.head && h!==state.head) return false;
    if(state.tail && t!==state.tail) return false;
    if(state.goods && r.货物类型!==state.goods) return false;
    if(state.tax && (r.是否包税||'')!==state.tax) return false;
    if(state.q){
      const hay = [r.渠道名称,r.交货仓库,r.城市,r.FBA仓库,r.国家,r.文件,r.来源表名].join(' ');
      if(!hay.includes(state.q)) return false;
    }
    return true;
  });
}

function render(rows){
  $('#cnt').textContent = rows.length;
  state.view==='table' ? renderTable(rows) : renderCards(rows);
}

function renderCards(rows){
  const list = $('#list');
  if(!rows.length){
    list.innerHTML = '<div class="empty">NO MATCH · 无匹配记录，试试重置筛选</div>';
    return;
  }
  list.innerHTML = rows.map((r,i)=>{
    const [h,t] = splitMode(r.运输方式);
    const taxCls = r.是否包税==='是'?'tax-y':(r.是否包税==='否'?'tax-n':'');
    const taxTxt = r.是否包税==='是'?'包税':(r.是否包税==='否'?'不包税':'—');
    const dest = r.FBA仓库 || r.城市 || (r.开始邮编? (r.开始邮编+' - '+(r.结束邮编||'')) : '') || '—';
    const tiers = Object.entries(r.价格||{});
    const priceHtml = tiers.length ? tiers.map(([tier,p])=>
      `<div class="ptier"><span class="t">${esc(tier)}</span><span class="p" title="${esc(fmtFull(p))}">${fmtPrice(p)}</span></div>`
    ).join('') : '<div class="ptier"><span class="t">—</span><span class="p">—</span></div>';
    return `
    <article class="card" style="animation-delay:${Math.min(i*18,360)}ms">
      <div class="top">
        <div>
          <div class="name">${esc(r.渠道名称)}</div>
          <div class="tags">
            <span class="tag">${esc(r.文件||'')}</span>
            <span class="tag">${esc(h||'—')} / ${esc(t||'—')}</span>
            <span class="tag">${esc(r.国家||'—')}</span>
            <span class="tag">${esc(r.货物类型||'—')}</span>
            <span class="tag ${taxCls}">${taxTxt}</span>
            <span class="tag unit">${esc(r.单位||'')}</span>
          </div>
        </div>
        <span class="line-tag">${esc(r.区间||'')}</span>
      </div>
      <div class="meta">
        <div class="mi"><span class="k">来源</span><span class="v">${esc(r.来源表名||'')} R${esc(r.来源行号??'')}</span></div>
        <div class="mi"><span class="k">时效</span><span class="v">${esc(r.时效||'—')}</span></div>
        <div class="mi"><span class="k">目的地</span><span class="v">${esc(dest)}</span></div>
        <div class="mi"><span class="k">交货</span><span class="v">${esc(r.交货仓库||r.交货地||'—')}</span></div>
        ${r.体积重量比?`<div class="mi"><span class="k">重比</span><span class="v">1:${esc(r.体积重量比)}</span></div>`:''}
      </div>
      <div class="price">
        <div class="pl">PRICE TIERS · 单位：${esc(r.单位||'—')}</div>
        <div class="ptiers">${priceHtml}</div>
      </div>
    </article>`;
  }).join('');
}

      }).join('');
      return `<tr>
        <td class="c-src"><span class="cl">${esc(r.来源表名||'')} R${esc(r.来源行号??'')}</span></td>
        <td class="c-name" title="${esc(r.渠道名称)}"><span class="cl">${esc(r.渠道名称)}</span></td>
        <td class="c-mode"><span class="cl">${esc(r.运输方式||'—')}</span></td>
        <td><span class="cl">${esc(r.国家||'—')}</span></td>
        <td><span class="cl">${esc(r.货物类型||'—')}</span></td>
        <td>${tax}</td>
        <td title="${esc(dest)}"><span class="cl">${esc(dest)}</span></td>
        <td class="c-eta" title="${esc(r.时效||'—')}"><span class="cl">${esc(r.时效||'—')}</span></td>
        ${priceTd}
      </tr>`;
    }).join('');
    return `<div class="tgroup" style="animation-delay:${Math.min(gi*60,300)}ms">
      <div class="tg-head">
        <span class="tg-title"><span class="ln">${esc(g[0].文件||'')}</span> · ${esc(line)} · ${esc(zone)}</span>
        <span class="tg-meta">${g.length} 条 · 单位 ${esc(unit)}</span>
      </div>
      <div class="tbl-scroll">
        <table class="tbl" style="min-width:${tMin}px">
          ${colgroup}
          <thead><tr>${headCells}${priceCells}</tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');
}

['file','src','country','head','tail','goods','tax'].forEach(k=>{
  $('#'+ (k==='file'?'f-file':k==='src'?'f-src':k==='country'?'f-country':k==='head'?'f-head':k==='tail'?'f-tail':k==='goods'?'f-goods':'f-tax'))
    .addEventListener('change',e=>{
      state[k]=e.target.value;
      if(k==='file') updateSrcs();
      render(filter());
    });
});
$('#f-q').addEventListener('input',e=>{state.q=e.target.value.trim();render(filter());});
$('#btn-reset').addEventListener('click',()=>{
  ['file','src','country','head','tail','goods','tax'].forEach(k=>{state[k]='';});
  $('#f-file').value='';updateSrcs();$('#f-country').value='';$('#f-head').value='';$('#f-tail').value='';$('#f-goods').value='';$('#f-tax').value='';$('#f-q').value='';
  render(filter());
});
$('#v-card').addEventListener('click',()=>{
  if(state.view==='card') return;
  state.view='card';
  $('#v-card').classList.add('active');
  $('#v-table').classList.remove('active');
  render(filter());
});
$('#v-table').addEventListener('click',()=>{
  if(state.view==='table') return;
  state.view='table';
  $('#v-table').classList.add('active');
  $('#v-card').classList.remove('active');
  render(filter());
});
$('#f-toggle').addEventListener('click',()=>{
  const fb = document.querySelector('.filterbar');
  const collapsed = fb.classList.toggle('collapsed');
  $('#f-toggle').textContent = collapsed ? '筛选条件 ▾' : '收起条件 ▴';
  syncFbH();
});

/* 表头冻结：滚动/尺寸变化时同步筛选栏高度，表头停在其下方不被覆盖 */
function syncFbH(){
  const fb = document.querySelector('.filterbar');
  const h = fb ? fb.offsetHeight : 0;
  document.documentElement.style.setProperty('--fb-h', h + 'px');
}
window.addEventListener('scroll', syncFbH, {passive:true});
window.addEventListener('resize', syncFbH);
syncFbH();

init();
render(filter());
</script>
</body>
</html>
